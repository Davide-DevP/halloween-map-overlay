<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>var $ = require('jquery')</script>
</head>
<style>
    * {
        margin: 0;
    }
    ::-webkit-scrollbar {
        display: none;
    }
    body{
        background-color: #00ff00;
    }
    /* Same map name the overlay shows, under the same setting. Static flow
       rather than absolute positioning: this window is resized by the user in
       OBS, not sized to the map, so the label just follows the image. */
    #mapLabel {
        display: none;
        padding: 2px 6px;
        font: 600 13px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #ffe9d2;
        text-shadow: 0 0 4px #000, 0 0 2px #000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    /* Same marker layer as the transparent overlay, so a stream shows what the
       player sees. No rotation here: this window is not the overlay. */
    #mapStack {
        position: relative;
        line-height: 0;
        width: 0;
        /* `body` here is in normal flow, not a flex container, so this stack
           is not a flex item and cannot be shrunk the way the overlay's was
           (see src/map/map.html). Set anyway, so the two pages cannot drift
           if this one ever grows a layout. */
        flex: none;
    }
    #mapStack img {
        width: 100%;
        height: auto;
        display: block;
    }
    #markerLayer {
        position: absolute;
        pointer-events: none;
        overflow: visible;
    }
    #markerLegend {
        display: none;
        padding: 2px 6px;
        font: 600 11px/1.3 "Segoe UI", system-ui, sans-serif;
        color: #ffe9d2;
        text-shadow: 0 0 4px #000, 0 0 2px #000;
    }
    .marker-chip {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }
    .marker-swatch {
        width: 8px;
        height: 8px;
        border: 2px solid #fff;
        border-radius: 1px;
        background: transparent;
        flex: none;
    }
</style>
<body>
<div id="mapStack">
    <img src="" id="mainImg"/>
    <svg id="markerLayer" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div id="markerLegend"></div>
<div id="mapLabel"></div>
</body>
<script src="renderer_obs.js"></script>
</html>
