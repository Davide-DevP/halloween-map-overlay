<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>var $ = require('jquery')</script>
</head>
<style>
    * {
        margin: 0;
    }
    ::-webkit-scrollbar {
        display: none;
    }
    /* Center the map so rotation pivots around the window center -- the
       window itself is sized to the rotated bounding box by the main process */
    body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    /* Name of the map: for a few seconds after an automatic switch, or
       permanently when Settings > Overlay > Map name is "Always".
       Absolutely positioned so it cannot resize the window, which is sized to
       the rotated map by the main process. Never rotated with the map: it has
       to stay readable. It sits at the bottom, inside the 10 % of extra height
       the main process adds to the rotated bounding box, so it does not land
       on top of the map itself. */
    #mapLabel {
        position: absolute;
        bottom: 2px;
        left: 0;
        right: 0;
        display: none;
        text-align: center;
        font: 600 13px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #ffe9d2;
        text-shadow: 0 0 4px #000, 0 0 2px #000;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    /* Map + markers as one block, so the rotation pivots around the pair and
       the SVG can never drift off the image. The width and the rotation moved
       here from #mainImg; the image fills it and keeps its own aspect ratio. */
    #mapStack {
        position: relative;
        line-height: 0;
        width: 0;
        /* `body` is a flex container, so this is a flex ITEM — and a flex item
           shrinks below its `width` when the line overflows. That is exactly
           what a rotated non-square map does: the window is sized to the
           *rotated* bounding box, so at 90 deg a 16:9 map is laid out ~1.78x
           wider than the window is and `flex-shrink: 1` quietly scaled it to
           ~56 %. It never showed on the four bundled maps, which are square;
           a custom 16:9 image shrank every time it was turned on its side.
           The rotation used to live on the <img>, which has a definite width
           and no such rule. `flex: none` restores that. */
        flex: none;
    }
    #mapStack img {
        width: 100%;
        height: auto;
        display: block;
    }
    /* Positioned by src/map/markers.js: it extends a few pixels past the map on
       every side so a marker on the edge is not clipped in half. */
    #markerLayer {
        position: absolute;
        pointer-events: none;
        overflow: visible;
    }
    /* Top-left corner of the window, never rotated: a legend that turns on its
       side with the map is unreadable, and it is only ever a line or two. */
    #markerLegend {
        position: absolute;
        top: 2px;
        left: 2px;
        display: none;
        pointer-events: none;
        font: 600 11px/1.3 "Segoe UI", system-ui, sans-serif;
        color: #ffe9d2;
        text-shadow: 0 0 4px #000, 0 0 2px #000;
    }
    .marker-chip {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }
    .marker-swatch {
        width: 8px;
        height: 8px;
        border: 2px solid #fff;
        border-radius: 1px;
        background: transparent;
        flex: none;
    }
</style>
<body>
  <div id="mapStack">
    <img src="" id="mainImg"/>
    <svg id="markerLayer" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="markerLegend"></div>
  <div id="mapLabel"></div>
</body>
<script src="renderer.js"></script>
</html>
