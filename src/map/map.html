<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>var $ = require('jquery')</script>
</head>
<style>
    * {
        margin: 0;
    }
    ::-webkit-scrollbar {
        display: none;
    }
    /* Center the map so rotation pivots around the window center -- the
       window itself is sized to the rotated bounding box by the main process */
    body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    /* Name of the map: for a few seconds after an automatic switch, or
       permanently when Settings > Overlay > Map name is "Always".
       Absolutely positioned so it cannot resize the window, which is sized to
       the rotated map by the main process. Never rotated with the map: it has
       to stay readable. It sits at the bottom, inside the 10 % of extra height
       the main process adds to the rotated bounding box, so it does not land
       on top of the map itself. */
    #mapLabel {
        position: absolute;
        bottom: 2px;
        left: 0;
        right: 0;
        display: none;
        text-align: center;
        font: 600 13px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #ffe9d2;
        text-shadow: 0 0 4px #000, 0 0 2px #000;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>
<body>
  <img src="" id="mainImg"/>
  <div id="mapLabel"></div>
</body>
<script src="renderer.js"></script>
</html>
