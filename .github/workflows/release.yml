name: Release

# Publishing is driven entirely by tags: `git tag vX.Y.Z && git push --tags`.
# Nothing is released on an ordinary push to main.
on:
  push:
    tags:
      - 'v*'

permissions:
  # electron-builder needs this to create the release and upload the installers
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Create the release first so electron-builder only uploads into it.
      # Letting electron-builder create it raced on v0.2.0 and produced two
      # release objects for the same tag (assets split between them).
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "See README.md for install and update notes." --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The maps are committed, so there is no prepare-maps step here; this
      # builds exactly the images that are in the repository.
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
