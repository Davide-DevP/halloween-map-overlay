name: Release

# Publishing is driven entirely by tags: `git tag vX.Y.Z && git push --tags`.
# Nothing is released on an ordinary push to main.
on:
  push:
    tags:
      - 'v*'

permissions:
  # electron-builder needs this to create the release and upload the installers
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The maps are committed, so there is no prepare-maps step here; this
      # builds exactly the images that are in the repository.
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
