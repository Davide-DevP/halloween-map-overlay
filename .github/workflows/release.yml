name: Release

# Publishing is driven entirely by tags: `git tag vX.Y.Z && git push --tags`.
# Nothing is released on an ordinary push to main.
on:
  push:
    tags:
      - 'v*'

permissions:
  # electron-builder needs this to create the release and upload the installers
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `hmo-updater.exe` is compiled with the csc.exe that ships inside
      # Windows — no msbuild, no NuGet, no .NET SDK. It is a separate step
      # rather than part of "Build" so that a runner image without the .NET
      # Framework compiler fails here, loudly and by name, instead of producing
      # a release whose installer quietly has no themed updater in it.
      - name: Build updater
        shell: bash
        run: |
          CSC="$WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          if [ ! -f "$CSC" ]; then
            echo "::error::csc.exe not found at $CSC - windows-latest no longer ships the .NET Framework 4 compiler."
            exit 1
          fi
          npm run build-updater
          ls -la build/updater build/updater/fonts

      # The maps are committed, so there is no prepare-maps step here; this
      # builds exactly the images that are in the repository.
      # electron-builder builds only; the upload is done by gh below, because
      # electron-builder's own uploader stalled for 30+ minutes on the ~97 MB
      # installers twice (v0.3.1, v0.3.2) and ended in a GitHub 500.
      - name: Build
        run: npx electron-builder --win --publish never

      # Created by us, not by electron-builder: letting electron-builder create
      # it raced on v0.2.0 and produced two release objects for the same tag
      # (assets split between them). Created only AFTER both builds succeeded,
      # so a failed build cannot leave a published release with no assets for
      # every installed copy's update check to trip over.
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "See README.md for install and update notes." --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        shell: bash
        run: |
          ls -la dist
          # gh names an asset after the file and turns spaces into dots, while
          # latest.yml (and therefore the updater) expects electron-builder's
          # dash names. Stage copies under the dash names before uploading.
          mkdir -p upload
          for f in dist/*.exe dist/*.blockmap; do cp "$f" "upload/$(basename "$f" | tr " " "-")"; done
          cp dist/latest.yml upload/
          ls -la upload
          for f in upload/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ github.ref_name }}" "$f" --clobber; then break; fi
              echo "upload of $f failed (attempt $attempt), retrying in 30 s"; sleep 30
              [ "$attempt" = 5 ] && exit 1
            done
          done
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[] | "(.name) (.size)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
